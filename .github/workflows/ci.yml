name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;34.0.0

      - name: Build and run Android unit tests
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Run JavaScript tests
        run: node --test tests/*.test.cjs

      - name: Check audio routing
        run: python3 tests/audio_route_test.py

      - name: Audit public source
        run: python3 tools/audit_public.py
